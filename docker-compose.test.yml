services:
  db:
    image: postgres:15
    shm_size: 5g
    environment:
        - POSTGRES_HOST_AUTH_METHOD=trust
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    image: resolver-populate-test
    build: .
    entrypoint: ["/bin/sh", "-ec"]
    command: ["python manage.py migrate && python manage.py test"]
    environment:
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=postgres
      - SQL_USER=postgres
      - SQL_PASSWORD=
      - SQL_HOST=db
      - SQL_PORT=5432
    depends_on:
      db:
        condition: service_healthy

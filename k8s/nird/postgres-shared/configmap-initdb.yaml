apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-shared-initdb
data:
  01-create-app-databases.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    create_user_and_db() {
      local db_name="$1"
      local db_user="$2"
      local db_password="$3"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-SQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${db_user}') THEN
            CREATE ROLE "${db_user}" LOGIN PASSWORD '${db_password}';
          END IF;
        END
        \$\$;
        SELECT 'CREATE DATABASE "${db_name}" OWNER "${db_user}"'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${db_name}')\gexec
        GRANT ALL PRIVILEGES ON DATABASE "${db_name}" TO "${db_user}";
    SQL
    }

    create_user_and_db "${RESOLVER_DB_NAME}" "${RESOLVER_DB_USER}" "${RESOLVER_DB_PASSWORD}"
    create_user_and_db "${PUBLISHGPT_DB_NAME}" "${PUBLISHGPT_DB_USER}" "${PUBLISHGPT_DB_PASSWORD}"

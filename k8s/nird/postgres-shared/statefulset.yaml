apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-shared
spec:
  serviceName: postgres-shared-hl
  replicas: 1
  selector:
    matchLabels:
      app: postgres-shared
  template:
    metadata:
      labels:
        app: postgres-shared
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: init-postgres-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /projects/postgres-shared
              chown -R 999:999 /projects/postgres-shared
              chmod 700 /projects/postgres-shared
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: project-storage
              mountPath: /projects
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-shared-secrets
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: project-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres-shared
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: project-storage
          persistentVolumeClaim:
            claimName: 573890b9-3346-4027-ab0c-22eec6dfd665
        - name: initdb
          configMap:
            name: postgres-shared-initdb
            defaultMode: 0755

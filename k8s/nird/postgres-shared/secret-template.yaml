apiVersion: v1
kind: Secret
metadata:
  name: postgres-shared-secrets
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: replace-with-strong-admin-password
  POSTGRES_DB: postgres

  RESOLVER_DB_NAME: resolver
  RESOLVER_DB_USER: resolver_user
  RESOLVER_DB_PASSWORD: replace-with-strong-resolver-password

  PUBLISHGPT_DB_NAME: publishgpt
  PUBLISHGPT_DB_USER: publishgpt_user
  PUBLISHGPT_DB_PASSWORD: replace-with-strong-publishgpt-password

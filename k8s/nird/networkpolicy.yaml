apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resolver-web
spec:
  podSelector:
    matchLabels:
      app: resolver-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-ingress
      ports:
        - protocol: TCP
          port: 8080
